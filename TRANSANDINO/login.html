<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TransAndino Perú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b192c; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    header { background-color: #070f1e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.4rem; font-weight: bold; color: #ffffff; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo span { color: #38bdf8; }
    .bus-emoji { display: inline-block; animation: rodar 2s infinite ease-in-out; }
    @keyframes rodar { 0%, 100% { transform: translateX(0) translateY(0); } 50% { transform: translateX(6px) translateY(-2px); } }
    
    nav { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 0.9rem; border-radius: 6px; transition: all 0.3s ease; font-weight: 500; }
    nav a:hover { color: #ffffff; background: #1e293b; }
    
    .btn-login { border: 1px solid #38bdf8; color: #ffffff !important; background: #38bdf8; margin-left: 0.5rem; font-weight: bold; }
    .btn-register { background: #0284c7; color: #ffffff !important; font-weight: bold; }
    .btn-register:hover { background: #0369a1 !important; }

    /* Main Container */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .login-card { background: #15233b; border: 1px solid #1e293b; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .login-card h2 { text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem; color: #ffffff; font-weight: 700; }
    .login-card p { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; background: #0b192c; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: #38bdf8; }

    .btn-submit { width: 100%; padding: 0.8rem; background: #ea580c; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
    .btn-submit:hover { background: #c2410c; }

    .form-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
    .form-footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    .form-footer a:hover { text-decoration: underline; }

    footer { background-color: #070f1e; text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; border-top: 1px solid #1e293b; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <span class="bus-emoji">🚌</span> <span>TransAndino Perú</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="pages/servicios.html">Servicios</a>
      <a href="pages/requisitos.html">Requisitos</a>
      <a href="pages/compra-pasajes.html">Reserva / Horarios</a>
      <a href="pages/seguimiento.html">Encomiendas</a>
      <a href="pages/ubicacion.html">Ubicación y Sedes</a>

      <div style="display: inline-flex; gap: 0.5rem; align-items: center;">
        <a href="login.html" class="btn-login">Iniciar Sesión</a>
        <a href="registro.html" class="btn-register">Registrarse</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa a tu cuenta de TransAndino Perú</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
      </form>

      <div class="form-footer">
        ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TransAndino Perú - Desarrollado por Julius Axl Nickolai Perez Huamani.</p>
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const nombreExtraido = email.split('@')[0];
      const nombreFormateado = nombreExtraido.charAt(0).toUpperCase() + nombreExtraido.slice(1);

      // Guarda la sesión en localStorage y redirige al Inicio
      localStorage.setItem('user', JSON.stringify({ nombre: nombreFormateado, email: email }));
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
