<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TransAndino Perú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #050b14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1rem; }
    
    .login-card { background: #0d1626; border: 1px solid rgba(255, 255, 255, 0.08); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand-title { color: #38bdf8; font-size: 1.6rem; font-weight: bold; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.75rem 1rem; background: #050b14; border: 1px solid #1e293b; border-radius: 8px; color: white; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #0284c7; }

    .btn-submit { width: 100%; padding: 0.8rem; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
    .btn-submit:hover { background: #0369a1; }

    .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
    .footer-links a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">🚌 TransAndino Perú</h1>
    <p class="subtitle">Ingresa a tu cuenta corporativa o cliente</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@transandino.pe" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">🔑 Iniciar Sesión</button>
    </form>

    <div class="footer-links">
      ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a><br><br>
      <a href="index.html" style="color: #94a3b8; font-weight: normal;">← Volver al Inicio</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert('Por favor, ingresa tu correo y contraseña.');
        return;
      }

      let role = 'cliente';
      if (email.toLowerCase() === 'axlperez183@gmail.com') {
        role = 'admin';
      } else if (email.toLowerCase().includes('empleado')) {
        role = 'empleado';
      }
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userRole', role);

      if (role === 'admin' || role === 'empleado') {
        window.location.href = 'panel.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
