<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - TransAndino Perú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b192c; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 380px; }
    h2 { margin-bottom: 1rem; color: #38bdf8; text-align: center; }
    .group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 0.7rem; background: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #msg { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    .link { display: block; text-align: center; margin-top: 1rem; color: #38bdf8; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Crear Cuenta</h2>
    <form id="form-registro">
      <div class="group">
        <label>Nombre Completo</label>
        <input type="text" id="nombre" required placeholder="Tu Nombre">
      </div>
      <div class="group">
        <label>Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="******">
      </div>
      <button type="submit">Registrarse</button>
    </form>
    <div id="msg"></div>
    <a class="link" href="/login.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
  </div>

  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.textContent = 'Registrando...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.style.color = '#4ade80';
          msg.textContent = data.message + ' Redirigiendo al login...';
          setTimeout(() => { window.location.href = '/login.html'; }, 1500);
        } else {
          msg.style.color = '#f87171';
          msg.textContent = data.message;
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
