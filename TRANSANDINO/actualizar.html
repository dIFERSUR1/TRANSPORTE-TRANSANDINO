<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Registro - TransAndino Perú</title>
  <link rel="stylesheet" href="css/actualizar.css">
</head>
<body>

  <header>
    <a href="panel.html" class="logo"><span>⚙️</span> TransAndino Perú</a>
    <nav>
      <a href="panel.html">⬅ Volver al Panel</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Actualizar Pasaje / Registro</h1>
      <form id="update-form">
        <input type="hidden" id="reg-id">

        <div class="form-group">
          <label for="origen">Origen</label>
          <input type="text" id="origen" required>
        </div>

        <div class="form-group">
          <label for="destino">Destino</label>
          <input type="text" id="destino" required>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de Viaje</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="text" id="hora" required>
        </div>

        <div class="form-group">
          <label for="asiento">N° de Asiento</label>
          <input type="text" id="asiento" required>
        </div>

        <div class="form-group">
          <label for="precio">Precio (S/)</label>
          <input type="number" step="0.01" id="precio" required>
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado">
            <option value="disponible">disponible</option>
            <option value="registrado">registrado</option>
            <option value="atendido">atendido</option>
            <option value="cancelado">cancelado</option>
          </select>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn-submit">Guardar Cambios</button>
          <a href="panel.html" class="btn-cancel">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TransAndino Perú - Sistema de Gestión de Operaciones.</p>
  </footer>

  <!-- Carga de la configuración centralizada de Neon y el script modular -->
  <script type="module" src="js/config/neon-config.js"></script>
  <script type="module" src="js/actualizar/actualizar.js"></script>
</body>
</html>
