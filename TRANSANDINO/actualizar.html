<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Registro - TransAndino Perú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b192c; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

    header { background-color: #070f1e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.4rem; font-weight: bold; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: #ea580c; }

    nav { display: flex; align-items: center; gap: 1rem; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 0.9rem; border-radius: 6px; font-weight: 500; background: transparent; }
    nav a:hover { background: #1e293b; }

    main { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    .card { background: #15233b; border: 1px solid #1e293b; border-radius: 12px; padding: 2rem; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    h1 { font-size: 1.8rem; color: #ea580c; margin-bottom: 1.5rem; text-align: center; }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 500; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #1e293b; background: #070f1e; color: white; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #ea580c; }

    .btn-container { display: flex; gap: 1rem; margin-top: 2rem; }
    .btn-submit { flex: 1; background: #22c55e; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn-submit:hover { background: #16a34a; }
    .btn-cancel { flex: 1; background: #ef4444; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; text-align: center; text-decoration: none; display: inline-block; }
    .btn-cancel:hover { background: #dc2626; }

    footer { background-color: #070f1e; text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; border-top: 1px solid #1e293b; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <a href="panel.html" class="logo"><span>⚙️</span> TransAndino Perú</a>
    <nav>
      <a href="panel.html">⬅ Volver al Panel</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Actualizar Pasaje / Registro</h1>
      <form id="update-form" onsubmit="guardarCambios(event)">
        <input type="hidden" id="reg-id">

        <div class="form-group">
          <label for="origen">Origen</label>
          <input type="text" id="origen" required>
        </div>

        <div class="form-group">
          <label for="destino">Destino</label>
          <input type="text" id="destino" required>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de Viaje</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="text" id="hora" required>
        </div>

        <div class="form-group">
          <label for="asiento">N° de Asiento</label>
          <input type="text" id="asiento" required>
        </div>

        <div class="form-group">
          <label for="precio">Precio (S/)</label>
          <input type="number" step="0.01" id="precio" required>
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado">
            <option value="disponible">disponible</option>
            <option value="registrado">registrado</option>
            <option value="atendido">atendido</option>
            <option value="cancelado">cancelado</option>
          </select>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn-submit">Guardar Cambios</button>
          <a href="panel.html" class="btn-cancel">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TransAndino Perú - Sistema de Gestión de Operaciones.</p>
  </footer>

  <script>
    const API_URL = '/api/compras';

    const urlParams = new URLSearchParams(window.location.search);
    const registroId = urlParams.get('id');

    document.addEventListener('DOMContentLoaded', () => {
      if (!registroId) {
        alert('No se especificó un ID válido para actualizar.');
        window.location.href = 'panel.html';
        return;
      }
      cargarDatosRegistro(registroId);
    });

    async function cargarDatosRegistro(id) {
      let pasajes = [];
      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          pasajes = await res.json();
        } else {
          pasajes = JSON.parse(localStorage.getItem('compras_pasajes')) || [];
        }
      } catch (err) {
        pasajes = JSON.parse(localStorage.getItem('compras_pasajes')) || [];
      }

      const registro = pasajes.find(p => String(p.id) === String(id));

      if (!registro) {
        alert('No se encontró el registro en la base de datos o almacenamiento local.');
        window.location.href = 'panel.html';
        return;
      }

      document.getElementById('reg-id').value = registro.id;
      document.getElementById('origen').value = registro.origen || 'Ica';
      document.getElementById('destino').value = registro.destino || 'Lima';
      document.getElementById('fecha').value = (registro.fecha_viaje ? registro.fecha_viaje.split('T')[0] : (registro.fecha || '2026-10-15'));
      document.getElementById('hora').value = registro.hora_viaje || registro.hora || '09:00 AM';
      document.getElementById('asiento').value = registro.asiento || registro.num_asiento || '1';
      document.getElementById('precio').value = registro.precio || 50;
      document.getElementById('estado').value = registro.estado || 'registrado';
    }

    async function guardarCambios(event) {
      event.preventDefault();

      const id = document.getElementById('reg-id').value;
      const datosActualizados = {
        origen: document.getElementById('origen').value,
        destino: document.getElementById('destino').value,
        fecha_viaje: document.getElementById('fecha').value,
        hora_viaje: document.getElementById('hora').value,
        asiento: document.getElementById('asiento').value,
        precio: parseFloat(document.getElementById('precio').value),
        estado: document.getElementById('estado').value
      };

      try {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosActualizados)
        });
      } catch (err) {
        console.log('Error al conectar con la API, actualizando localmente...');
      }

      let pasajes = JSON.parse(localStorage.getItem('compras_pasajes')) || [];
      let index = pasajes.findIndex(p => String(p.id) === String(id));
      if (index !== -1) {
        pasajes[index] = { ...pasajes[index], ...datosActualizados };
        localStorage.setItem('compras_pasajes', JSON.stringify(pasajes));
      }

      alert('¡Registro actualizado exitosamente!');
      window.location.href = 'panel.html';
    }
  </script>

</body>
</html>
