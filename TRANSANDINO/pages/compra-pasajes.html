<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Pasajes - TransAndino Perú</title>
  <style>
    :root {
      --bg-color: #050b14;
      --card-bg: #0d1626;
      --border-color: rgba(255, 255, 255, 0.08);
      --orange-accent: #f97316;
      --blue-accent: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --red-seat: #dc2626;
      --green-seat: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar superior */
    .navbar {
      background: #030710;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 0.6rem;
      list-style: none;
      align-items: center;
    }

    .nav-item {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-item.active {
      background: var(--orange-accent);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-item.btn-box {
      background: #111e33;
      border: 1px solid var(--border-color);
    }

    .nav-item.btn-box:hover {
      background: #1a2c47;
    }

    .auth-buttons {
      display: flex;
      gap: 0.6rem;
    }

    .btn-login {
      border: 1px solid var(--blue-accent);
      color: #38bdf8;
      background: transparent;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-login:hover {
      background: rgba(2, 132, 199, 0.2);
    }

    .btn-register {
      background: var(--blue-accent);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-register:hover {
      background: #0369a1;
    }

    /* Contenedor Principal */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .page-title {
      color: #38bdf8;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    /* Controles de Filtro */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .control-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .control-group select, 
    .control-group input {
      background: #081120;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .control-group select:focus, 
    .control-group input:focus {
      border-color: #38bdf8;
    }

    /* Leyenda de Asientos */
    .section-subtitle {
      font-size: 0.95rem;
      color: #38bdf8;
      margin-bottom: 0.8rem;
    }

    .legend-bar {
      background: #081120;
      padding: 0.6rem;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .dot.free { background: #1e293b; border: 1px solid #334155; }
    .dot.selected { background: var(--orange-accent); }
    .dot.occupied { background: var(--red-seat); }

    /* Grilla de Asientos */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 0.3rem;
      margin-bottom: 1.5rem;
    }

    .seat-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.75rem 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .seat-btn:hover:not(.occupied) {
      border-color: var(--orange-accent);
      background: #334155;
    }

    .seat-btn.selected {
      background: var(--orange-accent) !important;
      border-color: #ea580c !important;
      color: #ffffff;
    }

    .seat-btn.occupied {
      background: var(--red-seat) !important;
      border-color: #b91c1c !important;
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* Pie de Compra */
    .total-price {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--green-seat);
    }
  </style>
</head>
<body>

  <!-- Navbar idéntico para mantener la navegación -->
  <header class="navbar">
    <a href="../index.html" class="brand">
      🚌 TransAndino Perú
    </a>
    
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html" class="nav-item">🏡 Inicio</a></li>
        <li><a href="servicios.html" class="nav-item btn-box">📘 Servicios</a></li>
        <li><a href="requisitos.html" class="nav-item">📜 Requisitos</a></li>
        <li><a href="compra-pasajes.html" class="nav-item active">🩹 Pasajes</a></li>
        <li><a href="encomiendas.html" class="nav-item">📦 Encomiendas</a></li>
        <li><a href="ubicacion.html" class="nav-item">📍 Ubicación</a></li>
      </ul>
    </nav>

    <div class="auth-buttons">
      <a href="login.html" class="btn-login">🔑 Iniciar Sesión</a>
      <a href="registro.html" class="btn-register">✍️ Registrarse</a>
    </div>
  </header>

  <main class="main-container">
    <div class="booking-card">
      <h1 class="page-title">Reserva de Pasajes de Viaje 🩹</h1>

      <div class="controls-grid">
        <div class="control-group">
          <label for="origen">Origen</label>
          <select id="origen">
            <option>Lima</option>
            <option>Huancayo</option>
            <option>Arequipa</option>
            <option>Cusco</option>
          </select>
        </div>

        <div class="control-group">
          <label for="destino">Destino</label>
          <select id="destino">
            <option>Ica</option>
            <option>Lima</option>
            <option>Huancayo</option>
            <option>Ayacucho</option>
          </select>
        </div>

        <div class="control-group">
          <label for="fecha">Fecha de Viaje</label>
          <input type="date" id="fecha" value="2026-09-30">
        </div>

        <div class="control-group">
          <label for="hora">Hora de Salida</label>
          <select id="hora">
            <option>08:00 AM</option>
            <option>02:00 PM</option>
            <option>10:00 PM</option>
          </select>
        </div>
      </div>

      <div class="section-subtitle">Selecciona tu Asiento</div>

      <div class="legend-bar">
        <div class="legend-item"><span class="dot free"></span> Libre</div>
        <div class="legend-item"><span class="dot selected"></span> Seleccionado</div>
        <div class="legend-item"><span class="dot occupied"></span> Comprado</div>
      </div>

      <div class="seats-grid" id="seatsGrid">
        <!-- Generado dinámicamente -->
      </div>

      <div class="total-price" id="totalDisplay">
        Precio Total: S/ 0.00
      </div>
    </div>
  </main>

  <script>
    const TICKET_PRICE = 45.00; // Precio por pasaje
    const occupiedSeats = [2, 10]; // Asientos ocupados según tu diseño

    const seatsGrid = document.getElementById('seatsGrid');
    const totalDisplay = document.getElementById('totalDisplay');
    let selectedCount = 0;

    for (let i = 1; i <= 20; i++) {
      const btn = document.createElement('button');
      btn.className = 'seat-btn';
      btn.textContent = `Asiento ${i}`;

      if (occupiedSeats.includes(i)) {
        btn.classList.add('occupied');
      } else {
        btn.addEventListener('click', () => {
          btn.classList.toggle('selected');
          if (btn.classList.contains('selected')) {
            selectedCount++;
          } else {
            selectedCount--;
          }
          const total = selectedCount * TICKET_PRICE;
          totalDisplay.textContent = `Precio Total: S/ ${total.toFixed(2)}`;
        });
      }

      seatsGrid.appendChild(btn);
    }
  </script>
</body>
</html>
