<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva / Horarios - TransAndino Perú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b192c; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #070f1e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.4rem; font-weight: bold; color: #ffffff; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo span { color: #38bdf8; }
    nav { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 0.9rem; border-radius: 6px; }
    .btn-login { background: #0284c7; color: white; border-radius: 6px; font-weight: bold; margin-left: 0.5rem; text-decoration: none; }
    .btn-login:hover { background: #0369a1; }
    .btn-admin { background: #ea580c; color: white; border-radius: 6px; font-weight: bold; margin-left: 0.5rem; text-decoration: none; }
    .btn-admin:hover { background: #c2410c; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; margin-left: 0.5rem; }
    .btn-logout:hover { background: #dc2626; }

    main { max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; font-size: 2.2rem; }

    .card-box { background: #15233b; border: 1px solid #1e293b; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; text-align: left; }
    .form-group label { color: #38bdf8; font-size: 0.9rem; font-weight: bold; }
    .form-group select, .form-group input { padding: 0.8rem; border-radius: 6px; border: 1px solid #1e293b; background: #0b192c; color: white; font-size: 0.95rem; }

    .btn-buscar { background: #ea580c; color: white; border: none; padding: 0.9rem 2rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; }
    .btn-buscar:hover { background: #c2410c; }

    footer { background-color: #070f1e; text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo">🚌 <span>TransAndino Perú</span></a>
    <nav>
      <a href="../index.html">🏠 Inicio</a>
      <a href="servicios.html">🧳 Servicios</a>
      <a href="requisitos.html">📋 Requisitos</a>
      <a href="compra-pasajes.html" style="background:#ea580c; color:white;">🎟️ Reserva / Horarios</a>
      <a href="seguimiento.html">📦 Encomiendas</a>
      <a href="ubicacion.html">📍 Ubicación</a>

      <!-- Botón de Iniciar Sesión (Si no hay sesión activa) -->
      <a href="../login.html" id="btn-login" class="btn-login">🔑 Iniciar Sesión</a>

      <!-- Datos de Sesión (Si el usuario ya inició sesión) -->
      <span id="user-display" style="color:#38bdf8; font-weight:bold; margin-left:0.5rem; display:none;"></span>
      <a href="../panel.html" id="btn-panel-admin" class="btn-admin" style="display:none;">⚙️ Panel Admin</a>
      <button id="btn-logout" class="btn-logout" onclick="cerrarSesion()" style="display:none;">Cerrar Sesión</button>
    </nav>
  </header>

  <main>
    <h1>Reserva de Pasajes y Horarios 🎟️</h1>

    <div class="card-box">
      <form onsubmit="event.preventDefault(); buscarHorarios();">
        <div class="form-grid">
          <div class="form-group">
            <label for="origen">Origen</label>
            <select id="origen" required>
              <option value="Ica">Ica</option>
              <option value="Lima">Lima</option>
              <option value="Arequipa">Arequipa</option>
            </select>
          </div>

          <div class="form-group">
            <label for="destino">Destino</label>
            <select id="destino" required>
              <option value="Lima">Lima</option>
              <option value="Ica">Ica</option>
              <option value="Arequipa">Arequipa</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fecha">Fecha de Viaje</label>
            <input type="date" id="fecha" required>
          </div>
        </div>

        <button type="submit" class="btn-buscar">🔍 Buscar Horarios Disponibles</button>
      </form>

      <div id="resultado-horarios" style="margin-top: 2rem; display: none;"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TransAndino Perú - Desarrollado por Julius Axl Nicolai Perez Huamani.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const usuarioActual = JSON.parse(localStorage.getItem('user'));

      if (usuarioActual) {
        document.getElementById('btn-login').style.display = 'none';

        const userDisplay = document.getElementById('user-display');
        userDisplay.innerText = `👋 Hola, ${usuarioActual.nombre || usuarioActual.email}`;
        userDisplay.style.display = 'inline';

        document.getElementById('btn-logout').style.display = 'inline-block';

        if (usuarioActual.email === 'axlperez183@gmail.com') {
          document.getElementById('btn-panel-admin').style.display = 'inline-block';
        } else {
          document.getElementById('btn-panel-admin').style.display = 'none';
        }
      } else {
        document.getElementById('btn-login').style.display = 'inline-block';
        document.getElementById('user-display').style.display = 'none';
        document.getElementById('btn-logout').style.display = 'none';
        document.getElementById('btn-panel-admin').style.display = 'none';
      }
    });

    function cerrarSesion() {
      localStorage.removeItem('user');
      alert('Sesión cerrada correctamente.');
      window.location.href = '../login.html';
    }

    function buscarHorarios() {
      const origen = document.getElementById('origen').value;
      const destino = document.getElementById('destino').value;
      const fecha = document.getElementById('fecha').value;
      const res = document.getElementById('resultado-horarios');

      if (origen === destino) {
        alert('El origen y el destino no pueden ser iguales.');
        return;
      }

      res.style.display = 'block';
      res.innerHTML = `<p style="color:#38bdf8;">Buscando viajes desde <strong>${origen}</strong> hacia <strong>${destino}</strong> para la fecha <strong>${fecha}</strong>...</p>`;
    }
  </script>
</body>
</html>
