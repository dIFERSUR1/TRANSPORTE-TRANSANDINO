<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Pasajes - Transporte Transandino</title>
  <style>
    :root {
      --bg-color: #0d1527;
      --card-bg: #131e32;
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #0284c7;
      --text-color: #f8fafc;
      
      /* Colores para los estados de asientos */
      --asiento-disponible: #253346;
      --asiento-seleccionado: #ea580c; /* Naranja */
      --asiento-ocupado: #dc2626;     /* Rojo */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .card-reserva {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 2rem;
    }

    /* Formulario de selección */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.8rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #090e1a;
      color: var(--text-color);
      outline: none;
      font-size: 0.95rem;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
    }

    /* Leyenda de estados */
    .leyenda {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.2rem;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem;
      border-radius: 8px;
    }

    .item-leyenda {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .box-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    .titulo-asientos {
      display: block;
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Contenedor de 30 Asientos */
    .grid-asientos {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Disposición típica de bus de 4 filas */
      gap: 0.8rem;
      max-height: 320px;
      overflow-y: auto;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 1.8rem;
    }

    /* Scrollbar personalizada para los asientos */
    .grid-asientos::-webkit-scrollbar {
      width: 6px;
    }
    .grid-asientos::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Estilo del botón del asiento */
    .btn-asiento {
      padding: 0.85rem 0.2rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--asiento-disponible);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-asiento:hover:not(:disabled) {
      transform: scale(1.04);
      border-color: #38bdf8;
    }

    /* Estado: Seleccionado (Naranja) */
    .btn-asiento.seleccionado {
      background-color: var(--asiento-seleccionado) !important;
      box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
      border-color: #ffedd5;
    }

    /* Estado: Comprado / Ocupado (Rojo) */
    .btn-asiento.comprado {
      background-color: var(--asiento-ocupado) !important;
      cursor: not-allowed;
      opacity: 0.65;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .resumen-precio {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 1.5rem;
    }

    .btn-confirmar {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s ease;
    }

    .btn-confirmar:hover {
      background: #0369a1;
    }

    .btn-confirmar:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card-reserva">
    <h1>Reserva de Pasajes de Viaje 🖊️</h1>

    <!-- Formulario superior -->
    <div class="form-grid">
      <div class="form-group">
        <label>Origen</label>
        <select><option>Lima</option></select>
      </div>
      <div class="form-group">
        <label>Destino</label>
        <select><option>Ica</option></select>
      </div>
      <div class="form-group">
        <label>Fecha de Viaje</label>
        <input type="date" value="2026-09-30">
      </div>
      <div class="form-group">
        <label>Hora de Salida</label>
        <select><option>08:00 AM</option></select>
      </div>
    </div>

    <span class="titulo-asientos">Selecciona tu Asiento</span>

    <!-- Leyenda explicativa -->
    <div class="leyenda">
      <div class="item-leyenda">
        <div class="box-color" style="background: var(--asiento-disponible);"></div> Libre
      </div>
      <div class="item-leyenda">
        <div class="box-color" style="background: var(--asiento-seleccionado);"></div> Seleccionado
      </div>
      <div class="item-leyenda">
        <div class="box-color" style="background: var(--asiento-ocupado);"></div> Comprado
      </div>
    </div>

    <!-- Contenedor dinámico para los 30 asientos -->
    <div class="grid-asientos" id="grid-asientos"></div>

    <div class="resumen-precio">
      Precio Total: S/ <span id="precio-total">0.00</span>
    </div>

    <button class="btn-confirmar" onclick="confirmarReserva()">Confirmar Reserva y Guardar</button>
  </div>

  <script>
    const TOTAL_ASIENTOS = 30;
    const PRECIO_PASAJE = 65.00;
    
    // Asientos comprados guardados en localStorage (si no hay datos, inicializa con el Asiento 2 y 10 ya comprados para prueba)
    let asientosComprados = JSON.parse(localStorage.getItem('asientos_comprados')) || [2, 10];
    let asientoSeleccionado = null;

    function renderizarAsientos() {
      const container = document.getElementById('grid-asientos');
      container.innerHTML = '';

      for (let i = 1; i <= TOTAL_ASIENTOS; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-asiento';
        btn.innerText = `Asiento ${i}`;

        // Verificar si el asiento ya fue comprado (Rojo)
        if (asientosComprados.includes(i)) {
          btn.classList.add('comprado');
          btn.disabled = true; // Bloquea el botón para que NO se pueda volver a comprar
          btn.title = "Este asiento ya fue comprado";
        } else {
          // Si el usuario lo seleccionó (Naranja)
          if (asientoSeleccionado === i) {
            btn.classList.add('seleccionado');
          }
          btn.onclick = () => seleccionarAsiento(i);
        }

        container.appendChild(btn);
      }
    }

    function seleccionarAsiento(numero) {
      asientoSeleccionado = numero;
      document.getElementById('precio-total').innerText = PRECIO_PASAJE.toFixed(2);
      renderizarAsientos();
    }

    function confirmarReserva() {
      if (!asientoSeleccionado) {
        alert('Por favor, selecciona un asiento disponible antes de confirmar.');
        return;
      }

      // Marcar el asiento seleccionado como comprado
      asientosComprados.push(asientoSeleccionado);
      
      // Guardar en almacenamiento local para persistencia
      localStorage.setItem('asientos_comprados', JSON.stringify(asientosComprados));

      alert(`¡Reserva confirmada! Has comprado el Asiento ${asientoSeleccionado} por S/ ${PRECIO_PASAJE.toFixed(2)}.`);
      
      asientoSeleccionado = null;
      document.getElementById('precio-total').innerText = '0.00';
      renderizarAsientos();
    }

    // Inicializar al cargar el documento
    document.addEventListener('DOMContentLoaded', renderizarAsientos);
  </script>

</body>
</html>
