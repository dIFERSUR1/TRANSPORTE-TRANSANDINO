<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva / Horarios - TransAndino Perú</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* MANTIENE LA BARRA DE SCROLL ESTABLE PARA EVITAR EL SALTO A LA DERECHA */
    html {
      scrollbar-gutter: stable;
    }

    body {
      background-color: #0b192c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER Y NAVEGACIÓN IDÉNTICOS */
    header {
      background-color: #070f1e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo span {
      color: #38bdf8;
    }

    .emoji {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      text-align: center;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    nav a:hover {
      color: #ffffff;
      background: #1e293b;
    }

    nav a.active {
      background-color: #ea580c;
      color: #ffffff;
      font-weight: bold;
    }

    .btn-login {
      border: 1px solid #38bdf8;
      color: #38bdf8 !important;
      margin-left: 0.5rem;
    }

    .btn-login:hover {
      background: #38bdf8 !important;
      color: #0b192c !important;
    }

    .btn-register {
      background: #0284c7;
      color: #ffffff !important;
      font-weight: bold;
    }

    .btn-register:hover {
      background: #0369a1 !important;
    }

    .btn-admin {
      background: #ea580c;
      color: #ffffff !important;
      font-weight: bold;
    }

    /* CONTENEDOR PRINCIPAL CENTRADO */
    main {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 2rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* TARJETA DE FORMULARIO CENTRADA */
    .form-card {
      background: #15233b;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 750px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      margin-bottom: 1.8rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .form-group select,
    .form-group input {
      background: #070f1e;
      border: 1px solid #1e293b;
      color: #ffffff;
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #38bdf8;
    }

    .btn-search {
      width: 100%;
      background: #ea580c;
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-search:hover {
      background: #c2410c;
    }

    footer {
      background-color: #070f1e;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo">
      <span class="emoji">🚌</span> <span>TransAndino Perú</span>
    </a>
    <nav>
      <a href="../index.html"><span class="emoji">🏠</span> Inicio</a>
      <a href="servicios.html"><span class="emoji">📘</span> Servicios</a>
      <a href="requisitos.html"><span class="emoji">📜</span> Requisitos</a>
      <a href="compra-pasajes.html" class="active"><span class="emoji">🎟</span> Reserva / Horarios</a>
      <a href="seguimiento.html"><span class="emoji">📦</span> Encomiendas</a>
      <a href="ubicacion.html"><span class="emoji">📍</span> Ubicación y Sedes</a>

      <div id="auth-buttons" style="display: inline-flex; gap: 0.5rem; align-items: center;">
        <a href="../login.html" class="btn-login"><span class="emoji">🔑</span> Iniciar Sesión</a>
        <a href="../registro.html" class="btn-register"><span class="emoji">✍️</span> Registrarse</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Reserva de Pasajes y Horarios <span class="emoji">🎟</span></h1>

    <div class="form-card">
      <form id="search-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="origen">Origen</label>
            <select id="origen">
              <option value="Ica">Ica</option>
              <option value="Lima">Lima</option>
              <option value="Arequipa">Arequipa</option>
              <option value="Huancayo">Huancayo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="destino">Destino</label>
            <select id="destino">
              <option value="Lima">Lima</option>
              <option value="Ica">Ica</option>
              <option value="Arequipa">Arequipa</option>
              <option value="Cusco">Cusco</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fecha">Fecha de Viaje</label>
            <input type="date" id="fecha">
          </div>
        </div>

        <button type="submit" class="btn-search">
          🔍 Buscar Horarios Disponibles
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TransAndino Perú - Desarrollado por Julius Axl Nickolai Perez Huamani.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authContainer = document.getElementById('auth-buttons');
      const user = JSON.parse(localStorage.getItem('user'));
      
      if (user) {
        const nombreUsuario = user.nombre || user.email;
        let htmlContent = `<span style="color: #38bdf8; font-weight: bold; margin-left: 0.5rem;">👋 Hola, ${nombreUsuario}</span>`;

        if (user.email === 'axlperez183@gmail.com') {
          htmlContent += `
            <a href="../panel.html" class="btn-admin" style="padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; margin-left: 0.5rem; display: inline-flex; align-items: center; gap: 4px;">
              <span class="emoji">⚙️</span> Panel Admin
            </a>
          `;
        }

        htmlContent += `
          <button id="logout-btn" style="background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 0.5rem;">
            Cerrar Sesión
          </button>
        `;

        authContainer.innerHTML = htmlContent;

        document.getElementById('logout-btn').addEventListener('click', () => {
          localStorage.removeItem('user');
          window.location.reload();
        });
      }
    });
  </script>

</body>
</html>
