<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Pasajes - TransAndino Perú</title>
  <style>
    :root {
      --bg-color: #050b14;
      --card-bg: #0d1626;
      --border-color: rgba(255, 255, 255, 0.08);
      --orange-accent: #ea580c;
      --blue-accent: #0284c7;
      --cyan-light: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: #030710;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--cyan-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 0.4rem; list-style: none; align-items: center; }

    .nav-item {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .nav-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    .nav-item.active {
      background: var(--orange-accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
    }

    .auth-buttons { display: flex; gap: 0.6rem; align-items: center; }

    .btn-login {
      border: 1px solid var(--blue-accent);
      color: var(--cyan-light);
      background: transparent;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-register {
      background: var(--blue-accent);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .user-greeting { color: var(--cyan-light); font-weight: bold; font-size: 0.88rem; }

    .btn-panel-admin {
      background: var(--orange-accent);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .btn-logout-red {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .main-container {
      flex: 1;
      padding: 2.5rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      font-size: 2rem;
      color: var(--cyan-light);
      margin-bottom: 1.5rem;
      font-weight: 800;
    }

    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: var(--text-color);
      font-weight: 600;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    .btn-search {
      grid-column: 1 / -1;
      padding: 0.85rem;
      background: var(--orange-accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: #030710;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="../index.html" class="brand">
      <span>🚌</span> TransAndino Perú
    </a>
    
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html" class="nav-item"><span class="icon">🍊</span> Inicio</a></li>
        <li><a href="servicios.html" class="nav-item"><span class="icon">📘</span> Servicios</a></li>
        <li><a href="requisitos.html" class="nav-item"><span class="icon">📜</span> Requisitos</a></li>
        <li><a href="compra-pasajes.html" class="nav-item active"><span class="icon">🎟</span> Pasajes</a></li>
        <li><a href="seguimiento.html" class="nav-item"><span class="icon">📦</span> Encomiendas</a></li>
        <li><a href="ubicacion.html" class="nav-item"><span class="icon">📍</span> Ubicación</a></li>
      </ul>
    </nav>

    <div class="auth-buttons" id="auth-container">
      <a href="../login.html" class="btn-login"><span class="icon">🔑</span> Iniciar Sesión</a>
      <a href="../registro.html" class="btn-register"><span class="icon">✍️</span> Registrarse</a>
    </div>
  </header>

  <main class="main-container">
    <h1 class="page-title">🎟 Reserva y Salidas de Pasajes</h1>

    <div class="search-card">
      <div class="form-group">
        <label>Origen</label>
        <select>
          <option>Lima</option>
          <option>Huancayo</option>
          <option>Arequipa</option>
          <option>Cusco</option>
        </select>
      </div>

      <div class="form-group">
        <label>Destino</label>
        <select>
          <option>Huancayo</option>
          <option>Lima</option>
          <option>Arequipa</option>
          <option>Cusco</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha de Viaje</label>
        <input type="date">
      </div>

      <button class="btn-search" onclick="alert('Buscando itinerarios disponibles...')">🔍 Buscar Pasajes</button>
    </div>
  </main>

  <footer>
    © 2026 TransAndino Perú - Desarrollado por Julius Axl Nickolai Perez Huamani.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const userEmail = localStorage.getItem('userEmail');
      let userRole = localStorage.getItem('userRole');
      const authContainer = document.getElementById('auth-container');

      if (isLoggedIn && userEmail && authContainer) {
        if (!userRole) {
          const lower = userEmail.toLowerCase();
          if (lower.includes('axperez') || lower.includes('axlperez')) userRole = 'admin';
          else if (lower.includes('transandinoempleado')) userRole = 'empleado';
          else userRole = 'cliente';
        }

        const rawName = userEmail.includes('@') ? userEmail.split('@')[0] : userEmail;
        const formattedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
        const panelLabel = userRole === 'admin' ? '⚙️ Panel Admin' : (userRole === 'empleado' ? '⚙️ Panel Empleado' : '⚙️ Mi Panel');

        authContainer.innerHTML = `
          <span class="user-greeting">👋 Hola, ${formattedName}</span>
          ${(userRole === 'admin' || userRole === 'empleado') 
            ? `<a href="../panel.html" class="btn-panel-admin">${panelLabel}</a>` 
            : ''}
          <button onclick="cerrarSesion()" class="btn-logout-red">Cerrar Sesión</button>
        `;
      }
    });

    function cerrarSesion() {
      localStorage.clear();
      window.location.reload();
    }
  </script>

</body>
</html>
