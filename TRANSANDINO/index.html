<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Transandino - Inicio</title>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: rgba(20, 32, 58, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Barra de Navegación */
    .navbar {
      background: rgba(11, 19, 41, 0.8);
      backdrop-filter: blur(10px);
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #38bdf8;
    }

    /* Sección Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.8rem;
      color: #38bdf8;
      margin-bottom: 0.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
    }

    /* Card Buscador Centrado */
    .card-buscador {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 2.5rem;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      margin-bottom: 1.8rem;
      text-align: left;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #070d19;
      color: var(--text-color);
      outline: none;
      font-size: 0.95rem;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
    }

    .btn-buscar {
      width: 100%;
      padding: 1.1rem;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-buscar:hover {
      background: #0369a1;
    }

    .btn-buscar:active {
      transform: scale(0.99);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      🚌 Transporte Transandino
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="compra-pasajes.html">Reserva de Pasajes</a></li>
      <li><a href="panel-admin.html">Intranet / Empleados</a></li>
    </ul>
  </nav>

  <!-- Contenido Principal -->
  <main class="hero">
    <h1>Viaja por el Perú con Transporte Transandino</h1>
    <p>Reserva tus pasajes de forma rápida, segura y desde cualquier dispositivo.</p>

    <div class="card-buscador">
      <form action="compra-pasajes.html" method="GET">
        <div class="form-grid">
          <div class="form-group">
            <label for="origen">Origen</label>
            <select id="origen" name="origen">
              <option value="Lima">Lima</option>
              <option value="Ica">Ica</option>
              <option value="Huancayo">Huancayo</option>
              <option value="Ayacucho">Ayacucho</option>
            </select>
          </div>

          <div class="form-group">
            <label for="destino">Destino</label>
            <select id="destino" name="destino">
              <option value="Ica">Ica</option>
              <option value="Lima">Lima</option>
              <option value="Huancayo">Huancayo</option>
              <option value="Ayacucho">Ayacucho</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fecha">Fecha de Viaje</label>
            <input type="date" id="fecha" name="fecha" value="2026-09-30">
          </div>

          <div class="form-group">
            <label for="hora">Hora de Salida</label>
            <select id="hora" name="hora">
              <option value="08:00 AM">08:00 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="10:00 PM">10:00 PM</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-buscar">Buscar Asientos Disponibles ➔</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Transporte Transandino. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
