<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Transandino - Control de Operaciones y Turnos</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text-color: #f1f5f9;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-color);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Encabezado animado */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease-out;
    }

    .header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Panel de simulación (Glassmorphism) */
    .panel-control {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeIn 1s ease-out;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    select {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .info-card {
      background: rgba(0, 0, 0, 0.25);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border-left: 4px solid var(--accent-color);
      min-width: 280px;
    }

    .info-card p {
      margin: 0.2rem 0;
      font-size: 0.9rem;
    }

    /* Grilla de Operaciones */
    .grid-operaciones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.5rem;
    }

    /* Tarjeta individual con efectos 3D y hover */
    .card-op {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease;
      animation: fadeInUp 0.6s ease-out forwards;
      position: relative;
      overflow: hidden;
    }

    .card-op:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .card-op h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.4rem;
    }

    .card-op p {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
    }

    /* Badges / Indicadores de Estado */
    .badge-estado {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.4s ease, transform 0.2s ease;
    }

    .badge-pendiente  { background-color: #f59e0b; color: #1e1b4b; }
    .badge-proceso    { background-color: #3b82f6; color: #ffffff; }
    .badge-completado { 
      background-color: #10b981; 
      color: #ffffff; 
      animation: pulseGlow 2s infinite; 
    }
    .badge-cancelado  { background-color: #ef4444; color: #ffffff; }

    .select-estado {
      margin-top: 0.8rem;
      width: 100%;
      font-size: 0.85rem;
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Animaciones CSS3 (Keyframes) */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Transporte Transandino</h1>
      <p>Panel de Verificación Docente - Gestión de Turnos y Operaciones</p>
    </header>

    <!-- Simulación de sesión -->
    <section class="panel-control">
      <div class="control-group">
        <label for="select-usuario">Simular Usuario Activo:</label>
        <select id="select-usuario" onchange="cambiarUsuarioActivo()">
          <!-- Carga dinámicamente -->
        </select>
      </div>

      <div class="info-card" id="info-usuario">
        <!-- Detalles del usuario logueado -->
      </div>
    </section>

    <!-- Contenedor de las 30 operaciones -->
    <main>
      <h2 style="margin-bottom: 1rem; font-size: 1.3rem;">
        Listado de Operaciones (<span id="total-ops">0</span>/30)
      </h2>
      <div class="grid-operaciones" id="grid-operaciones">
        <!-- Las 30 tarjetas cargan con JavaScript -->
      </div>
    </main>
  </div>

  <script>
    // 1. Datos iniciales: 01 Admin, 3 Empleados (por Turno) y 10 Clientes
    const usuarios = [
      { id: 'ADM01', nombre: 'Admin Principal', rol: 'admin', turno: 'todos' },
      { id: 'EMP01', nombre: 'Carlos López (Turno Mañana: 06:00 - 14:00)', rol: 'empleado', turno: 'manana' },
      { id: 'EMP02', nombre: 'Ana Martínez (Turno Tarde: 14:00 - 22:00)', rol: 'empleado', turno: 'tarde' },
      { id: 'EMP03', nombre: 'Pedro Gómez (Turno Noche: 22:00 - 06:00)', rol: 'empleado', turno: 'noche' },
      { id: 'CLI01', nombre: 'Juan Pérez', rol: 'cliente' },
      { id: 'CLI02', nombre: 'María Rodríguez', rol: 'cliente' },
      { id: 'CLI03', nombre: 'Luis García', rol: 'cliente' },
      { id: 'CLI04', nombre: 'Laura Torres', rol: 'cliente' },
      { id: 'CLI05', nombre: 'Diego Fernández', rol: 'cliente' },
      { id: 'CLI06', nombre: 'Sofía Castro', rol: 'cliente' },
      { id: 'CLI07', nombre: 'Mateo Morales', rol: 'cliente' },
      { id: 'CLI08', nombre: 'Elena Benítez', rol: 'cliente' },
      { id: 'CLI09', nombre: 'Javier Ríos', rol: 'cliente' },
      { id: 'CLI10', nombre: 'Camila Vargas', rol: 'cliente' }
    ];

    let usuarioActual = usuarios[0]; // Inicia con el Administrador

    // 2. Generación automática de 30 operaciones distintas
    const tiposOperacion = ['Encomienda', 'Pasaje Directo', 'Carga Pesada', 'Giro Postal', 'Reserva VIP'];
    const estadosDisponibles = ['Pendiente', 'En Proceso', 'Completado', 'Cancelado'];

    const operaciones = Array.from({ length: 30 }, (_, index) => {
      const num = (index + 1).toString().padStart(2, '0');
      const cliente = usuarios.filter(u => u.rol === 'cliente')[index % 10];
      
      return {
        id: `OP-${num}`,
        cliente: cliente.nombre,
        tipo: tiposOperacion[index % tiposOperacion.length],
        monto: `S/. ${(Math.floor(Math.random() * 45) + 5) * 10}`,
        estado: estadosDisponibles[index % estadosDisponibles.length]
      };
    });

    // 3. Determinar el turno actual según la hora real del sistema
    function obtenerTurnoActualSistema() {
      const hora = new Date().getHours();
      if (hora >= 6 && hora < 14) return 'manana';
      if (hora >= 14 && hora < 22) return 'tarde';
      return 'noche'; // 22:00 a 05:59
    }

    // 4. Validar si el usuario activo tiene permisos de edición
    function validarPermisoEdicion() {
      if (usuarioActual.rol === 'admin') {
        return { puedeEditar: true, motivo: 'Acceso Total (Administrador)' };
      }
      
      if (usuarioActual.rol === 'empleado') {
        const turnoActual = obtenerTurnoActualSistema();
        if (usuarioActual.turno === turnoActual) {
          return { puedeEditar: true, motivo: `Permitido por Turno Actual (${usuarioActual.turno.toUpperCase()})` };
        } else {
          return { 
            puedeEditar: false, 
            motivo: `Denegado: Su turno es "${usuarioActual.turno.toUpperCase()}" y el sistema está en turno "${turnoActual.toUpperCase()}".` 
          };
        }
      }

      return { puedeEditar: false, motivo: 'Los clientes no pueden modificar estados.' };
    }

    // 5. Renderizado y gestión de la interfaz
    function cargarSelectorUsuarios() {
      const select = document.getElementById('select-usuario');
      select.innerHTML = usuarios.map(u => 
        `<option value="${u.id}">${u.nombre} - [${u.rol.toUpperCase()}]</option>`
      ).join('');
    }

    function actualizarInfoUsuario() {
      const infoContainer = document.getElementById('info-usuario');
      const validacion = validarPermisoEdicion();
      
      infoContainer.innerHTML = `
        <p><strong>Usuario Activo:</strong> ${usuarioActual.nombre}</p>
        <p><strong>Rol:</strong> ${usuarioActual.rol.toUpperCase()}</p>
        <p><strong>Permiso de Edición:</strong> <span style="font-weight: 700; color: ${validacion.puedeEditar ? '#34d399' : '#f87171'}">${validacion.motivo}</span></p>
      `;
    }

    function cambiarUsuarioActivo() {
      const selectedId = document.getElementById('select-usuario').value;
      usuarioActual = usuarios.find(u => u.id === selectedId);
      actualizarInfoUsuario();
      renderizarOperaciones();
    }

    function cambiarEstado(idOp, nuevoEstado) {
      const validacion = validarPermisoEdicion();
      
      if (!validacion.puedeEditar) {
        alert(`Acceso Restringido:\n${validacion.motivo}`);
        renderizarOperaciones(); // Revertir cambios en el selector
        return;
      }

      const op = operaciones.find(o => o.id === idOp);
      if (op) {
        op.estado = nuevoEstado;
        renderizarOperaciones();
      }
    }

    function renderizarOperaciones() {
      const container = document.getElementById('grid-operaciones');
      document.getElementById('total-ops').innerText = operaciones.length;
      
      const validacion = validarPermisoEdicion();

      container.innerHTML = operaciones.map(op => {
        const badgeClass = `badge-${op.estado.toLowerCase().replace(' ', '')}`;
        
        return `
          <div class="card-op">
            <h3>${op.id} - ${op.tipo}</h3>
            <p><strong>Cliente:</strong> ${op.cliente}</p>
            <p><strong>Monto:</strong> ${op.monto}</p>
            <p><strong>Estado:</strong> <span class="badge-estado ${badgeClass}">${op.estado}</span></p>
            
            <select class="select-estado" 
                    ${!validacion.puedeEditar ? 'disabled' : ''} 
                    onchange="cambiarEstado('${op.id}', this.value)">
              ${estadosDisponibles.map(est => 
                `<option value="${est}" ${est === op.estado ? 'selected' : ''}>${est}</option>`
              ).join('')}
            </select>
          </div>
        `;
      }).join('');
    }

    // Inicialización al cargar el DOM
    document.addEventListener('DOMContentLoaded', () => {
      cargarSelectorUsuarios();
      actualizarInfoUsuario();
      renderizarOperaciones();
    });
  </script>

</body>
</html>
